# Trovework — nginx site config
# Install to: /etc/nginx/sites-available/trovework.conf
# Symlink to:  /etc/nginx/sites-enabled/trovework.conf
#
# This file is HTTP-only on purpose. Run certbot AFTER installing it:
#   sudo certbot --nginx -d trovework.com -d www.trovework.com
# Certbot injects the TLS (443) server block and the HTTP->HTTPS redirect,
# then renews automatically via its systemd timer.

# Redirect www -> apex (canonical host).
server {
    listen 80;
    listen [::]:80;
    server_name www.trovework.com;
    return 301 http://trovework.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name trovework.com;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is added only once TLS is live (uncomment after certbot succeeds):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Don't advertise the nginx version.
    server_tokens off;

    # Allow reasonably large uploads (resumes, ID images, portfolio photos).
    client_max_body_size 12M;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — everything under /api goes to the NestJS container, not Next.js.
    # Auth uses httpOnly cookies, so the proxy must pass them through untouched
    # and must never cache a response.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ID verification posts up to three ~8MB images at once; resumes and
        # portfolio photos also come through here. Larger than the 12M default
        # above, which still caps every other route.
        client_max_body_size 30M;

        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Next.js build assets — immutable, cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — needed for the Phase 5 chat layer.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
