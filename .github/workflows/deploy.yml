name: Deploy

# Deploys to the VPS on every push to master, once CI has passed.
# Requires these repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST     e.g. 172.86.122.212
#   VPS_USER     the deploy user (NOT root)
#   VPS_SSH_KEY  the PRIVATE half of the deploy keypair
#   VPS_PORT     optional, defaults to 22

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Only deploy if CI succeeded (or if triggered manually).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/trovework

            echo "--- Pulling latest master ---"
            git fetch --all
            git reset --hard origin/master

            echo "--- Building images ---"
            docker compose build api web

            echo "--- Starting database ---"
            docker compose up -d db

            echo "--- Applying migrations ---"
            # Runs before the new api starts, so the schema is never behind the
            # code that expects it. Prisma migrations are additive by default,
            # so this is safe to re-run.
            docker compose run --rm api npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

            echo "--- Restarting services ---"
            docker compose up -d api web

            echo "--- Cleaning up dangling images ---"
            docker image prune -f

            echo "--- Deployed commit ---"
            git log -1 --oneline

      - name: Verify site is responding
        run: |
          sleep 15
          web=$(curl -s -o /dev/null -w "%{http_code}" https://trovework.com || echo "000")
          echo "web  https://trovework.com -> $web"
          if [ "$web" != "200" ]; then
            echo "::error::Site did not return 200 after deploy"
            exit 1
          fi

          # 401 is the healthy answer here: the route exists and the auth guard
          # is refusing an unauthenticated request. 000 means the API is down,
          # 502 means nginx cannot reach it.
          api=$(curl -s -o /dev/null -w "%{http_code}" https://trovework.com/api/auth/me || echo "000")
          echo "api  /api/auth/me -> $api"
          if [ "$api" != "401" ]; then
            echo "::error::API did not answer 401 on /api/auth/me (got $api)"
            exit 1
          fi
