name: Deploy

# Deploys to the VPS on every push to master, once CI has passed.
# Requires these repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST     e.g. 172.86.122.212
#   VPS_USER     the deploy user (NOT root)
#   VPS_SSH_KEY  the PRIVATE half of the deploy keypair
#   VPS_PORT     optional, defaults to 22

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Only deploy if CI succeeded (or if triggered manually).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/trovework

            echo "--- Pulling latest master ---"
            git fetch --all
            git reset --hard origin/master

            echo "--- Building image ---"
            docker compose build web

            echo "--- Restarting service ---"
            docker compose up -d web

            echo "--- Cleaning up dangling images ---"
            docker image prune -f

            echo "--- Deployed commit ---"
            git log -1 --oneline

      - name: Verify site is responding
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" https://trovework.com || echo "000")
          echo "trovework.com returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Site did not return 200 after deploy"
            exit 1
          fi
